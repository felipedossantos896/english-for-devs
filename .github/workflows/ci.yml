name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: efd
          POSTGRES_PASSWORD: efd
          POSTGRES_DB: efd
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U efd" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://efd:efd@localhost:5432/efd
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm build
